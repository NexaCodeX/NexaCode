[package]
name = "nexacode-core"
version = "0.1.0"
description = "NexaCode core library"
authors = ["NexaCode"]
license = "MIT"
repository = "https://github.com/fansili/NexaCode"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
log = "0.4"
chrono = "0.4"
dirs = "5.0"
glob = "0.3"
regex = "1.10"
schemars = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
